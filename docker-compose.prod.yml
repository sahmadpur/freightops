# FreightOps — self-hosted production stack.
#
# Same routing pattern as the other apps on this server (saleswind, docai):
#   Cloudflare ──tunnel──> Traefik (:80) ──Host()──> freightops-app ──> db/minio/mailpit
#
# Only the app joins Traefik's shared `proxy` network; everything else is
# internal-only (no published ports). Build + run on the server:
#
#   cd /home/freightops
#   cp .env.example .env      # first time only — fill in secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Migrations run automatically on app start (drizzle-kit migrate, see Dockerfile).
#
# Parallel instances: the stack is parameterized by STACK (default `freightops`).
# A second checkout with STACK=<other> + its own APP_HOST in .env runs a fully
# independent copy (own network, volumes, db) on the same server — see DEPLOY.md.

name: ${STACK:-freightops}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${STACK:-freightops}-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage for documents (used from Phase 4 on). Internal-only.
  minio:
    image: minio/minio:latest
    container_name: ${STACK:-freightops}-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks:
      - default

  # Local SMTP sink. The notification worker sends here by default so invites
  # and alerts don't error. Point SMTP_* at a real MTA in .env to deliver mail.
  mailpit:
    image: axllent/mailpit:latest
    container_name: ${STACK:-freightops}-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
    networks:
      - default

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${STACK:-freightops}-app:latest
    container_name: ${STACK:-freightops}-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Canonical external origin so better-auth builds correct redirects and
      # secure cookies (app runs behind Cloudflare->Traefik; browser is on https).
      BETTER_AUTH_URL: https://${APP_HOST}
      APP_BASE_URL: https://${APP_HOST}
      # Service-name DNS (not container_name) so the same file works for any STACK.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-freightops-documents}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-FreightOps <no-reply@freightops.local>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      NODE_ENV: production
      # Issuer requisites printed on invoices/ACTs. Unset (demo/evaluation
      # instances) falls back to neutral placeholders — see src/modules/docgen/issuer.ts.
      ISSUER_NAME: ${ISSUER_NAME:-}
      ISSUER_ADDRESS: ${ISSUER_ADDRESS:-}
      ISSUER_TAX_ID: ${ISSUER_TAX_ID:-}
      ISSUER_BANK_NAME: ${ISSUER_BANK_NAME:-}
      ISSUER_BANK_ACCOUNT: ${ISSUER_BANK_ACCOUNT:-}
      ISSUER_BANK_CODE: ${ISSUER_BANK_CODE:-}
      ISSUER_BANK_TAX_ID: ${ISSUER_BANK_TAX_ID:-}
      ISSUER_CORRESPONDENT_ACCOUNT: ${ISSUER_CORRESPONDENT_ACCOUNT:-}
      ISSUER_SWIFT: ${ISSUER_SWIFT:-}
      ISSUER_PHONE: ${ISSUER_PHONE:-}
      ISSUER_EMAIL: ${ISSUER_EMAIL:-}
      ISSUER_SIGNATORY_NAME: ${ISSUER_SIGNATORY_NAME:-}
      ISSUER_SIGNATORY_TITLE: ${ISSUER_SIGNATORY_TITLE:-}
      ISSUER_LOGO_DATA_URI: ${ISSUER_LOGO_DATA_URI:-}
      # Next.js standalone server binds to $HOSTNAME, which Docker otherwise sets
      # to the container id (binds one interface). Force all-interfaces so Traefik
      # can reach it on the proxy network.
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    networks:
      - default   # reach db / minio / mailpit
      - proxy     # reached by Traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # Router/service names must be unique across everything Traefik sees —
      # STACK keeps parallel instances from clashing.
      - traefik.http.routers.${STACK:-freightops}.entrypoints=web
      - traefik.http.routers.${STACK:-freightops}.rule=Host(`${APP_HOST}`)
      - traefik.http.services.${STACK:-freightops}.loadbalancer.server.port=3000

volumes:
  pgdata:
  miniodata:

networks:
  default:
  proxy:
    external: true   # Traefik's shared network
